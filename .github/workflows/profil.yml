name: Visuels du profil

# Chaque jour : carte d'activité (scripts/build.py) et serpent des contributions,
# publiés sur la branche `output` que le README affiche.
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/profil.yml'

permissions:
  contents: write

concurrency:
  group: profil
  cancel-in-progress: true

jobs:
  visuels:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Dépendances
        run: pip install fonttools brotli

      - name: Carte d'activité
        run: python scripts/build.py stats dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Serpent des contributions
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#ff7a30&color_dots=#161b22,#4a2614,#86401c,#c9581f,#ff7a30
            dist/snake-light.svg?palette=github-light&color_snake=#ea580c&color_dots=#ebedf0,#ffdcc7,#ffb38a,#fb8a4c,#ea580c

      - name: Publication sur la branche output
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
          commit_message: Mise à jour des visuels du profil
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
